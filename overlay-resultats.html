'use strict';const KEY='vce_resultats_v2', $=id=>document.getElementById(id);function fit(){let s=Math.min(innerWidth/1920,innerHeight/1080),el=$('stage');el.style.transform=`scale(${s})`;el.style.left=(innerWidth-1920*s)/2+'px';el.style.top=(innerHeight-1080*s)/2+'px'}function niceDate(v){if(!v)return '';let a=String(v).split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:v}function node(cls,txt){let e=document.createElement('div');e.className=cls;e.textContent=txt||'';return e}function render(){let x={};try{x=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}$('event').textContent=x.event||'CHAMPIONNAT';$('date').textContent='📅 '+([niceDate(x.date),x.circuit].filter(Boolean).join('  ·  ')||'DATE DE COURSE');$('season').textContent='🏎️ SAISON '+(x.season||'2026');$('mode').textContent=({'individuel':'👤 INDIVIDUEL','endurance':'🤝 ENDURANCE','championnat':'🏆 CHAMPIONNAT'}[x.mode]||'🏆 RÉSULTATS');let rows=(x.results||[]).slice().sort((a,b)=>(Number(a.position)||999)-(Number(b.position)||999)).slice(0,10),n=rows.length,cols=n>5?2:1,r=Math.max(1,Math.ceil(n/cols)),host=$('board');host.replaceChildren();host.style.setProperty('--cols',cols);host.style.setProperty('--rows',r);host.style.setProperty('--board-height',(n<=3?610:690)+'px');host.classList.toggle('compact',n>5);$('stage').classList.toggle('group-results',n>=4);$('stage').classList.toggle('many-results',n>6);if(!n){host.append(node('empty','🏁 Aucun résultat enregistré'));return}if(n>=4){

  const name=[a.firstName,a.lastName].filter(Boolean).join(' ')||(Array.isArray(a.drivers)?a.drivers[0]:'')||'PILOTE';

 });

 host.append(portraits,list);return;
}
rows.forEach((a,i)=>{let p=Number(a.position)||i+1,card=node('result',''),rank=node('rank','');rank.append(node('medal',p===1?'🥇':p===2?'🥈':p===3?'🥉':'🏁'));rank.append(node('','P'+p));rank.lastChild.className='ranknumber';rank.lastChild.style.cssText='font-size:55px;font-weight:1000;line-height:1';rank.append(node('','POSITION'));rank.lastChild.className='ranklabel';card.append(rank);let body=node('content',''),top=node('topline','');top.append(node('flag','🏎️'));top.append(node('team',a.team||'VCE ESPORT'));body.append(top);let name=[a.firstName,a.lastName].filter(Boolean).join(' ')||(Array.isArray(a.drivers)?a.drivers[0]:'')||'PILOTE';body.append(node('name',name));let extras=[];if(x.mode!=='individuel'&&Array.isArray(a.drivers)&&a.drivers.length>1)extras.push('👥 '+a.drivers.join(' · '));if(a.number)extras.push('🔢 N° '+a.number);if(extras.length)body.append(node('extra',extras.join('   ')));card.append(body);if(a.brand||a.score){let side=node('side','');if(a.brand)side.append(node('car','🏎️ '+a.brand));if(a.score)side.append(node('score','⭐ '+a.score));card.append(side)}host.append(card)})}addEventListener('resize',fit);addEventListener('storage',e=>{if(e.key===KEY)render()});render();fit();
