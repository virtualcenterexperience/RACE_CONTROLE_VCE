name: Validate VCE website and resources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'data/**'
      - 'entrainements/**'
      - 'tools/**'
      - 'supabase/**'
      - 'integrations/**'
      - 'race-controle-windows/**'
      - '.github/workflows/validate-vce-site.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML paths and all JSON
        run: python tools/validate_site.py
      - name: Audit all CSS and embedded styles with asset reference checks
        run: python tools/audit_css.py
      - name: Check Python syntax without executing patch scripts
        run: python -m compileall -q tools race-controle-windows
      - name: Validate Google Apps Script syntax
        run: node --check < integrations/google-forms/onFormSubmit.gs
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' ! -path './race-controle-windows/*' -print0)
      - name: Validate JavaScript embedded in HTML pages
        run: node tools/validate_inline_js.mjs
      - name: Verify reversible interface translations and form values
        run: node tools/test-i18n.mjs
      - name: Verify measured replay and session timing
        run: node tools/test-telemetry-392.mjs
      - name: Verify telemetry scheduling and native sample playback
        run: node tools/test-telemetry-fluid.mjs
      - name: Verify interface action locks and responsive stylesheet coverage
        run: node tools/test-ui-actions.mjs
      - name: Verify Supabase publishable key authentication headers
        run: node tools/test-auth-headers.mjs
      - name: Verify Supabase session refresh behavior during outage
        run: node tools/test-auth-refresh.mjs
      - name: Verify next-day login persistence and auth outage recovery
        run: node tools/test-auth-continuity.mjs
      - name: Verify contextual GT3 coaching for Monza
        run: node tools/test-coach-engine.mjs
      - name: Verify conversational coaching and keyword retrieval
        run: node tools/test-coach-language.mjs
      - name: Verify race-result identity and Rallye exercises
        run: node tools/test-result-identity.mjs
      - name: Verify accepted race results update profile ratings once
        run: node tools/test-race-rating.mjs
      - name: Check module-specific scripts and GitHub/Supabase routing
        run: node tools/test-page-routing.mjs
