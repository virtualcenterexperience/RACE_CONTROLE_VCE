<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Résultats TEAM | VCE ESPORT</title>
<link rel="stylesheet" href="assets/css/vce-results-studio.css?v=1">
<script defer src="vce-supabase-config.js"></script>
<script defer src="vce-supabase.js?v=20261112-stability1"></script>
<script defer src="assets/js/vce-result-posters.js?v=1"></script>
<script type="module" src="assets/js/vce-results-studio.js?v=1"></script>
</head>
<body>
<header class="top"><a href="staff.html#staff-team">← TEAM Staff</a><strong>VCE <span>ESPORT</span></strong><a href="team-resultats-recus.html">Résultats reçus</a></header>
<main class="wrap">
  <h1>Résultats <span>TEAM</span></h1>
  <div class="switch" aria-label="Mode du studio">
    <button id="history-tab" type="button" aria-pressed="true">Voir ancien</button>
    <button id="create-tab" type="button" aria-pressed="false">Créer</button>
  </div>
  <p id="studio-status" role="status" aria-live="polite">Vérification de la session Staff…</p>
  <section id="history" hidden aria-labelledby="history-title">
    <div class="section-head"><h2 id="history-title">Historique des affiches</h2><a href="resultats-classement-staff.html">Classements officiels et rating ↗</a></div>
    <div id="history-list" class="history-list"></div>
  </section>
  <section id="studio" hidden aria-label="Création d’une affiche">
    <form id="result-form" class="panel">
      <h2>Données de course</h2>
      <div class="fields">
        <label>Type de résultat<select name="mode"><option value="solo">Solo / personnel</option><option value="championnat">Championnat</option><option value="endurance">Endurance</option></select></label>
        <label>Championnat ou épreuve<input name="event" placeholder="24 Heures du Mans" required maxlength="120"></label>
        <label>Circuit<input name="circuit" placeholder="Le Mans" maxlength="70"></label>
        <label>Date<input name="date" type="date"></label>
        <label>Numéro de voiture<input name="number" placeholder="24" required maxlength="8"></label>
        <label>Position<input name="position" type="number" min="1" max="999" step="1" required placeholder="1"></label>
        <label>Nombre de pilotes<select name="count" disabled><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      </div>
      <div id="drivers"></div>
    </form>
    <div class="editor">
      <div class="panel stage">
        <div class="section-head"><h2>Aperçu</h2><span class="dimension">1920 × 1090 px</span></div>
        <canvas id="poster" width="1920" height="1090" aria-label="Aperçu de l’affiche. Les coordonnées des textes sont aussi modifiables dans les outils."></canvas>
      </div>
      <aside class="panel tools" aria-label="Outils graphiques">
        <h2>Outils graphiques</h2>
        <label>Preset<select id="palette"><option value="red">Rouge + bleu</option><option value="yellow">Jaune + bleu</option><option value="gray">Rouge + gris + bleu</option></select></label>
        <label>Image de fond <small>JPEG, PNG ou TGA</small><input type="file" id="background" accept=".jpg,.jpeg,.png,.tga,image/jpeg,image/png"></label>
        <button id="clear-bg" class="quiet" type="button" hidden>Retirer le fond importé</button>
        <label>Texte sélectionné<select id="layers"></select></label>
        <div class="row"><button type="button" id="add-layer">+ Ajouter un texte</button><button type="button" id="remove-layer" class="quiet">Retirer</button></div>
        <div id="layer-fields" hidden>
          <label>Contenu<textarea id="layer-text" rows="2" maxlength="180"></textarea></label>
          <div class="fields coordinates">
            <label>X<input id="layer-x" type="number" min="0" max="1919"></label>
            <label>Y<input id="layer-y" type="number" min="0" max="1089"></label>
            <label>Taille<input id="layer-size" type="number" min="12" max="260"></label>
            <label>Couleur<input id="layer-color" type="color"></label>
          </div>
          <button class="quiet" id="reset-text" type="button" hidden>Reprendre la donnée de course</button>
        </div>
      </aside>
    </div>
    <div class="publish panel">
      <span id="audience">Sélectionne les pilotes destinataires.</span>
      <div class="row"><button type="button" id="download">Télécharger PNG</button><button type="button" id="archive">Archiver</button><button type="button" id="send" class="primary">Envoyer</button></div>
    </div>
    <p id="edit-status" role="status" aria-live="polite"></p>
  </section>
</main>
</body>
</html>
