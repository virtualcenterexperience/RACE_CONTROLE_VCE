<!doctype html><html lang="fr"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VCE ESPORT — Calendrier Full HD</title><link rel="stylesheet" href="vce-page-overlay-calendrier.css?v=20261111-1"><script defer src="assets/js/vce-overlay-editor.js?v=20261111-background2"></script></head><body class="vce-overlay-calendar"><img class="vce-official-logo footer-logo" src="data/images/Design_sans_titre_2-removebg-preview.png" alt="Logo officiel VCE ESPORT" onerror="this.style.display='none'"><main id="stage"><div class="photo"></div><div class="veil"></div><div class="slash"></div><div class="main"><div class="top"><div><div class="eyebrow">VCE ESPORT / RACE CONTROL TEAM</div><h1 class="title" id="name">VIRTUAL CENTER EXPERIENCE</h1></div><div class="righttitle"><strong>CALENDRIER</strong><span id="season">SAISON 2026</span><div class="redline"></div></div></div><div class="champ"><span class="champname" id="championship">CHAMPIONNAT</span><span class="champcount" id="count"></span></div><section class="cards" id="cards"></section></div><footer class="footer"><img class="logo" src="data/images/Design_sans_titre_2-removebg-preview.png" alt="Logo VCE ESPORT"><div class="footline"></div><div class="foottext">VCE ESPORT · 1920 × 1080</div></footer></main><script>
const KEY='vce_calendar_v1';
async function initCalendar(){
let data={};
if(new URLSearchParams(location.search).get('published')==='1'){
 try {const response=await fetch('data/team/calendrier.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();}catch(e){console.error('Calendrier publié indisponible',e);data={name:'Calendrier non publié',rounds:[]};}
}else{try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{}}
const rounds=Array.isArray(data.rounds)?data.rounds.slice(0,20):[];const $=id=>document.getElementById(id);const countryNames={BE:'Belgique',DE:'Allemagne',FR:'France',IT:'Italie',GB:'Royaume-Uni',US:'États-Unis',JP:'Japon',AU:'Australie',ES:'Espagne',PT:'Portugal',NL:'Pays-Bas',AT:'Autriche',HU:'Hongrie',ZA:'Afrique du Sud',BR:'Brésil',CA:'Canada',MX:'Mexique',SG:'Singapour',BH:'Bahreïn',QA:'Qatar',MY:'Malaisie',CN:'Chine',TH:'Thaïlande'};function txt(parent,tag,cls,value){const e=document.createElement(tag);e.className=cls;e.textContent=value;parent.append(e);return e}function dateText(s){if(!s)return 'DATE À VENIR';const d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()}$('name').textContent='VIRTUAL CENTER EXPERIENCE';$('season').textContent='SAISON '+(data.season||'2026');$('championship').textContent=data.name||'CHAMPIONNAT VCE';$('count').textContent=rounds.length+' MANCHE'+(rounds.length>1?'S':'')+(data.cars?'  /  '+data.cars:'');const host=$('cards');const cols=rounds.length>18?3:rounds.length>5?2:1;const rows=Math.max(1,Math.ceil(rounds.length/cols));host.style.setProperty('--cols',cols);host.style.setProperty('--rows',rows);host.style.setProperty('--cardsheight',rounds.length<=3?'570px':'670px');if(rows>=5||cols===2)host.classList.add('dense');if(rows>=7)host.classList.add('verydense');if(rows>=9)host.classList.add('ultradense');if(rows>=12)host.classList.add('microdense');if(!rounds.length)txt(host,'div','empty','En attente du calendrier officiel');rounds.forEach((r,i)=>{const card=document.createElement('article');card.className='card';host.append(card);const num=document.createElement('div');num.className='number';card.append(num);txt(num,'small','', 'MANCHE');txt(num,'b','',String(i+1).padStart(2,'0'));const info=document.createElement('div');info.className='cinfo';card.append(info);txt(info,'div','circuit',r.circuit||'CIRCUIT À DÉFINIR');const code=String(r.country||'').toUpperCase();txt(info,'div','country',countryNames[code]||code||'Pays à définir');const flag=document.createElement('div');flag.className='flagwrap';card.append(flag);if(/^[A-Z]{2}$/.test(code)){const img=document.createElement('img');img.src='data/drapeaux/'+code.toLowerCase()+'.png';img.alt='Drapeau '+code;img.onerror=()=>{flag.style.display='none'};flag.append(img)}else flag.style.display='none';txt(card,'div','date',dateText(r.date))});function resize(){const scale=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform='scale('+scale+')';$('stage').style.transformOrigin='top left';document.body.style.width=1920*scale+'px';document.body.style.height=1080*scale+'px'}addEventListener('resize',resize);addEventListener('storage',e=>{if(e.key===KEY && new URLSearchParams(location.search).get('published')!=='1')location.reload()});resize();
}
initCalendar();

</script><script>window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='VCE_CALENDAR_PRESET'||!e.data.data)return;try{const next=JSON.stringify(e.data.data);if(localStorage.getItem('vce_calendar_v1')!==next){localStorage.setItem('vce_calendar_v1',next);location.reload()}}catch(err){console.error(err)}});</script></body></html>
