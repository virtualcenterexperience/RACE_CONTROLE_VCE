<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VCE ESPORT — Calendrier Full HD</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#070c15;color:white;overflow:hidden;font-family:Arial,Helvetica,sans-serif}#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#091320}.photo{position:absolute;inset:0;background:url('data/images/fond-calendrier.png') center center/cover no-repeat;filter:brightness(.43) saturate(.65)}.veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,8,16,.83),rgba(6,18,34,.56) 50%,rgba(5,11,22,.78)),linear-gradient(0deg,rgba(3,8,16,.84),transparent 55%,rgba(3,8,16,.56))}.slash{position:absolute;left:0;top:0;width:18px;height:235px;background:#ef294b;transform:skewX(-22deg);transform-origin:top}.main{position:absolute;inset:48px 86px 105px}.top{display:flex;justify-content:space-between;gap:30px;align-items:flex-start}.eyebrow{font-size:21px;letter-spacing:5px;font-weight:900;color:#f6f8fc}.eyebrow:before{content:'▰▰▰';color:#f52b4c;margin-right:20px;letter-spacing:0}.title{font-weight:1000;font-size:75px;font-style:italic;text-transform:uppercase;letter-spacing:-2px;line-height:1.04;margin:17px 0 0;max-width:1190px;text-shadow:0 5px 20px #000}.righttitle{text-align:right;flex-shrink:0}.righttitle strong{font-size:65px;font-weight:1000;font-style:italic}.righttitle span{display:block;font-size:34px;letter-spacing:7px;font-style:italic;margin-top:4px}.redline{height:5px;background:#ef2b4b;margin-top:14px}.champ{display:flex;align-items:center;gap:25px;margin-top:35px;margin-bottom:29px;font-size:30px;font-weight:900;font-style:italic;text-transform:uppercase}.champname{padding:13px 40px;background:linear-gradient(90deg,#c30b2a,#83142c);transform:skewX(-12deg);max-width:1200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.champcount{color:#fff;white-space:nowrap}.champcount b{color:#ff3154}.cards{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:17px 24px;height:var(--cardsheight);align-content:st </style></head><body><main id="stage"><div class="photo"></div><div class="veil"></div><div class="slash"></div><div class="main"><div class="top"><div><div class="eyebrow">VCE ESPORT / RACE CONTROL TEAM</div><h1 class="title" id="name">VIRTUAL CENTER EXPERIENCE</h1></div><div class="righttitle"><strong>CALENDRIER</strong><span id="season">SAISON 2026</span><div class="redline"></div></div></div><div class="champ"><span class="champname" id="championship">CHAMPIONNAT</span><span class="champcount" id="count"></span></div><section class="cards" id="cards"></section></div><footer class="footer"><img class="logo" src="data/images/logo-vce.png" alt="Logo VCE ESPORT"><div class="footline"></div><div class="foottext">VCE ESPORT · 1920 × 1080</div></footer></main><script>
const KEY='vce_calendar_v1';
async function initCalendar(){
let data={};
if(new URLSearchParams(location.search).get('published')==='1'){
 try {const response=await fetch('data/team/calendrier.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();}catch(e){console.error('Calendrier publié indisponible',e);data={name:'Calendrier non publié',rounds:[]};}
}else{try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{}}
const rounds=Array.isArray(data.rounds)?data.rounds.slice(0,20):[];const $=id=>document.getElementById(id);const countryNames={BE:'Belgique',DE:'Allemagne',FR:'France',IT:'Italie',GB:'Royaume-Uni',US:'États-Unis',JP:'Japon',AU:'Australie',ES:'Espagne',PT:'Portugal',NL:'Pays-Bas',AT:'Autriche',HU:'Hongrie',ZA:'Afrique du Sud',BR:'Brésil',CA:'Canada',MX:'Mexique',SG:'Singapour',BH:'Bahreïn',QA:'Qatar',MY:'Malaisie',CN:'Chine',TH:'Thaïlande'};function txt(parent,tag,cls,value){const e=document.createElement(tag);e.className=cls;e.textContent=value;parent.append(e);return e}function dateText(s){if(!s)return 'DATE À VENIR';const d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()}$('name').textContent='VIRTUAL CENTER EXPERIENCE';$('season').textContent='SAISON '+(data.season||'2026');$('championship').textContent=data.name||'CHAMPIONNAT VCE';$('count').textContent=rounds.length+' MANCHE'+(rounds.length>1?'S':'')+(data.cars?'  /  '+data.cars:'');const host=$('cards');const cols=rounds.length>5?2:1;const rows=Math.max(1,Math.ceil(rounds.length/cols));host.style.setProperty('--cols',cols);host.style.setProperty('--rows',rows);host.style.setProperty('--cardsheight',rounds.length<=3?'570px':'670px');if(rows>=5||cols===2)host.classList.add('dense');if(rows>=8)host.classList.add('verydense');if(!rounds.length)txt(host,'div','empty','Ajoutez des manches dans le calendrier STAFF.');rounds.forEach((r,i)=>{const card=document.createElement('article');card.className='card';host.append(card);const num=document.createElement('div');num.className='number';card.append(num);txt(num,'small','', 'MANCHE');txt(num,'b','',String(i+1).padStart(2,'0'));const info=document.createElement('div');info.className='cinfo';card.append(info);txt(info,'div','circuit',r.circuit||'CIRCUIT À DÉFINIR');const code=String(r.country||'').toUpperCase();txt(info,'div','country',countryNames[code]||code||'Pays à définir');const flag=document.createElement('div');flag.className='flagwrap';card.append(flag);if(/^[A-Z]{2}$/.test(code)){const img=document.createElement('img');img.src='data/drapeaux/'+code.toLowerCase()+'.png';img.alt='Drapeau '+code;img.onerror=()=>{flag.style.display='none'};flag.append(img)}else flag.style.display='none';txt(card,'div','date',dateText(r.date))});function resize(){const scale=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform='scale('+scale+')';$('stage').style.transformOrigin='top left';document.body.style.width=1920*scale+'px';document.body.style.height=1080*scale+'px'}addEventListener('resize',resize);addEventListener('storage',e=>{if(e.key===KEY && new URLSearchParams(location.search).get('published')!=='1')location.reload()});resize();
}
initCalendar();

</script><script>window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='VCE_CALENDAR_PRESET'||!e.data.data)return;try{const next=JSON.stringify(e.data.data);if(localStorage.getItem('vce_calendar_v1')!==next){localStorage.setItem('vce_calendar_v1',next);location.reload()}}catch(err){console.error(err)}});</script></body></html>
