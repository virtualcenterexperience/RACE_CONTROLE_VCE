<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VCE ESPORT — Lineup badges</title><style>

</style></head><body><div class="stage"><div class="top"><div class="brand"><b>///</b> VCE ESPORT <b>/</b> RACE CONTROL TEAM</div><div class="meta"><strong id="comp"></strong><span id="details"></span></div></div><div class="heading"><div class="eyebrow">PRÉSENTATION OFFICIELLE</div><h1>DRIVER LINEUP</h1><p id="subtitle"></p><div class="rule"></div></div><div class="drivers" id="drivers"></div><div class="footer"><strong>VCE <b>ESPORT</b></strong><span id="bottom"></span></div></div><button class="controls" onclick="window.print()">Imprimer / PDF</button><script>
function scale(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1920,innerHeight/1080))}addEventListener('resize',scale);scale();let m={competition:'VCE ESPORT',type:'Championnat',date:'',circuit:'',voiture:'',subtitle:'COMPOSITION OFFICIELLE',pilotes:[{name:'PILOTE 01'},{name:'PILOTE 02'},{name:'PILOTE 03'}]};try{const d=JSON.parse(localStorage.getItem('vce_lineup_v1'));if(d&&Array.isArray(d.pilotes))m={...m,...d}}catch(e){}const set=(id,s)=>document.getElementById(id).textContent=s||'';set('comp',m.competition||'VCE ESPORT');set('details',[m.type,m.circuit].filter(Boolean).join(' • '));set('subtitle',m.subtitle||'COMPOSITION OFFICIELLE');set('bottom',[m.voiture,m.date].filter(Boolean).join(' • '));const root=document.getElementById('drivers');const people=m.pilotes.slice(0,6);if(people.length>=4)root.classList.add('many');people.forEach((p,i)=>{let d=document.createElement('article');d.className='driver';let num=document.createElement('div');num.className='num';num.textContent='PILOTE '+String(i+1).padStart(2,'0');let badge=document.createElement('div');badge.className='badge';let name=String(p.name||'À CONFIRMER').trim();badge.textContent=name.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();let title=document.createElement('div');title.className='name';title.textContent=name;let role=document.createElement('div');role.className='role';role.textContent='VCE ESPORT';d.append(num,badge,title,role);root.append(d)});
