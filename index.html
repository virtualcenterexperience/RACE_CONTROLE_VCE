<title>Race Controle VCE</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #080d17;
    color: #f5f7fc;
    font-family: Arial, Helvetica, sans-serif;
  }

  main {
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 100vh;
    min-height: 100svh;
    padding: clamp(24px, 5vw, 64px) 20px clamp(24px, 4vw, 48px);
    background:

      url("assets/images/vce-engineering-background.jpg") center / cover no-repeat;
    text-align: center;
  }

  h1 {
    align-self: center;
    justify-self: center;
    margin: 0;
    color: #ff3a60;
    font-size: clamp(28px, 6.1vw, 88px);
    font-weight: 900;
    line-height: 1.04;
    letter-spacing: -.045em;
    text-shadow: 0 4px 24px #080d17;
  }

  h1 a {
    display: inline-block;
    color: inherit;
    text-decoration: none;
  }

  h1 a:hover {
    color: #ff6b86;
  }

  h1 a:focus-visible {
    outline: 2px solid #f5f7fc;
    outline-offset: 7px;
  }

  footer p {
    margin: 0;
    font-size: clamp(11px, 1.3vw, 14px);
    font-weight: 700;
    line-height: 1.5;
    letter-spacing: .11em;
  }

  footer p + p {
    margin-top: 5px;
    color: #bccbe1;
  }
