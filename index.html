<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#080d17">
<title>Race Controle VCE</title>
<link rel="preload" as="image" href="assets/images/vce-engineering-background.jpg">
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #080d17;
    color: #f5f7fc;
    font-family: Arial, Helvetica, sans-serif;
  }

  main {
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 100vh;
    min-height: 100svh;
    padding: clamp(24px, 5vw, 64px) 20px clamp(24px, 4vw, 48px);
    background:
      linear-gradient(180deg, #080d1740, #080d1752 60%, #080d17e6),
      url("assets/images/vce-engineering-background.jpg") center / cover no-repeat;
    text-align: center;
  }

  h1 {
    margin: 0;
    color: #ff3a60;
    font-size: clamp(28px, 6.1vw, 88px);
    font-weight: 900;
    line-height: 1.04;
    letter-spacing: -.045em;
    text-shadow: 0 4px 24px #080d17;
  }

  .hero {
    display: grid;
    justify-items: center;
    align-self: center;
    gap: clamp(22px, 4vw, 36px);
  }

  .entry {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    min-height: 48px;
    padding: 0 24px;
    border: 1px solid #ff6480;
    border-radius: 6px;
    background: #bd143d;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .12em;
    text-decoration: none;
  }

  .entry:hover {
    background: #d61a46;
  }

  .entry:focus-visible {
    outline: 2px solid #f5f7fc;
    outline-offset: 5px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .entry {
      animation: entry-glow 2.8s ease-in-out infinite alternate;
    }

    @keyframes entry-glow {
      from { box-shadow: 0 0 8px #ff3a6040; }
      to { box-shadow: 0 0 24px #ff3a6080; }
    }
  }

  footer p {
    margin: 0;
    font-size: clamp(11px, 1.3vw, 14px);
    font-weight: 700;
    line-height: 1.5;
    letter-spacing: .11em;
  }

  footer p + p {
    margin-top: 5px;
    color: #bccbe1;
  }
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>RACE CONTROLE VCE</h1>
    <a class="entry" href="profile.html">ENTRÉE <span aria-hidden="true">›</span></a>
  </div>
  <footer>
    <p>Propriété de VCE ESPORT</p>
    <p>VIRTUAL CENTER EXPERIENCE</p>
  </footer>
</main>
</body>
</html>
