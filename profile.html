<style>
  * { box-sizing: border-box; }

  body {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    margin: 0;
    background: #080d17;
    color: #f5f7fc;
    font-family: Arial, Helvetica, sans-serif;
  }

  body::before {
    position: fixed;
    inset: 0;
    z-index: -1;
    content: "";
    background:
      linear-gradient(180deg, #080d175c, #080d17b8 62%, #080d17),
      url("assets/images/vce-engineering-background.jpg") center / cover no-repeat;
  }

  .page {
    width: min(100% - clamp(36px, 7vw, 120px), 1312px);
    margin-inline: auto;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 80px;
    border-bottom: 1px solid #c5d7ef26;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .09em;
  }

  .brand img { width: 58px; height: 44px; object-fit: contain; }
  .brand strong, .heading-accent { color: #ff466a; }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid #566880;
    border-radius: 6px;
    color: #f5f7fc;
    background: #101b2a;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
  }

  .back:hover { border-color: #f5f7fc; }

  h1 {
    margin: clamp(34px, 6vh, 74px) 0 clamp(25px, 4vh, 42px);
    font-size: clamp(34px, 5.1vw, 72px);
    font-weight: 900;
    letter-spacing: -.055em;
    line-height: .99;
  }

  .spaces {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(12px, 1.5vw, 24px);
  }

  .space {
    --accent: #68c4ff;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
    border: 1px solid #3a4b62;
    border-radius: 12px;
    background: #101a29;
    box-shadow: 0 12px 32px #0005;
    color: inherit;
    text-decoration: none;
  }

  .space--strategy { --accent: #ff6482; }
  .space--staff { --accent: #c4d0e1; }

  .space-photo {
    position: relative;
    overflow: hidden;
    aspect-ratio: 8 / 5;
    background: #172639;
  }

  .space-photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .space-photo::after {
    position: absolute;
    inset: 0;
    content: "";
    background: linear-gradient(0deg, #101a2966, transparent 48%);
  }

  .space-content {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto 1fr;
    align-items: start;
    gap: 8px 12px;
    padding: clamp(15px, 1.8vw, 26px);
    border-top: 2px solid var(--accent);
  }

  .space h2 {
    margin: 0;
    align-self: center;
    font-size: clamp(18px, 2.1vw, 30px);
    line-height: 1.06;
    letter-spacing: -.035em;
  }

  .space p {
    grid-column: 1 / -1;
    margin: 0;
    color: #c3d1e2;
    font-size: 14px;
    line-height: 1.55;
  }

  .space-arrow {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border: 1px solid #53677e;
    border-radius: 50%;
    color: var(--accent);
    font-size: 21px;
  }

  .space:hover, .space:focus-visible { border-color: var(--accent); }
  .space:hover .space-arrow, .space:focus-visible .space-arrow {
    background: var(--accent);
    border-color: var(--accent);
    color: #101a29;
  }

  :focus-visible { outline: 2px solid #f5f7fc; outline-offset: 4px; }

  footer {
    padding: 28px 0 76px;
    color: #9cafc7;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
  }

  #vce-language-switch {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: flex;
    gap: 3px;
    padding: 4px;
    border: 1px solid #53677e;
    border-radius: 30px;
    background: #101a29;
  }

  #vce-language-switch button {
    min-width: 36px;
    min-height: 36px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #c3d1e2;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }

  #vce-language-switch button[aria-pressed="true"] {
    background: #f5f7fc;
    color: #101a29;
  }

  @media (max-width: 740px) {
    .spaces { grid-template-columns: 1fr; }
    .space { grid-template-columns: minmax(105px, 32%) 1fr; grid-template-rows: auto; }
    .space-photo { aspect-ratio: auto; }
    .space-photo img { position: absolute; inset: 0; }
    .space-content { border-top: 0; border-left: 2px solid var(--accent); }
  }

  @media (max-width: 370px) {
    .space { grid-template-columns: 1fr; }
    .space-photo { aspect-ratio: 3 / 1; }
    .space-content { border-left: 0; border-top: 2px solid var(--accent); }
  }

  @media (prefers-reduced-motion: no-preference) {
    .space { transition: transform .2s ease, border-color .2s ease; }
    .space-photo img { transition: transform .35s ease; }
    .space:hover { transform: translateY(-4px); }
    .space:hover img { transform: scale(1.04); }
  }
</style>
</head>
<body>

      </div>
    </main>

    <footer>VIRTUAL CENTER EXPERIENCE</footer>
  </div>
</body>
</html>
